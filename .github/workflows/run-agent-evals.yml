name: Run Agent Evaluations

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "evals/**"
      - "requirements.txt"
      - ".github/workflows/run-agent-evals.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: agent-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # Fork PRs cannot receive an OIDC token, so Azure login would always fail.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    environment: dev
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
      EVAL_THRESHOLD: "3.0"
      # Restricts DefaultAzureCredential to developer credentials so it uses the
      # azure/login CLI session instead of probing IMDS for a managed identity.
      AZURE_TOKEN_CREDENTIALS: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run evaluations
        timeout-minutes: 20
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python -m evals.run_evals 2>&1 | tee agent-eval-results.txt

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results-${{ github.run_id }}
          path: agent-eval-results.txt
          if-no-files-found: error
          retention-days: 30