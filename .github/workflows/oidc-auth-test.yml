name: OIDC Auth Test

# Manually triggered smoke test to confirm GitHub -> Azure OIDC login works
# before wiring up a real deploy workflow. No secrets, no client secret.
on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated token exchange
  contents: read

jobs:
  verify-login:
    runs-on: ubuntu-latest
    environment: dev   # must match the federated credential subject (environment:dev)
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show signed-in account
        run: az account show --output table
