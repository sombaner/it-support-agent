name: Deploy to QA

# Provisions the QA Foundry project + model, deploys the hosted agent, and ships
# the chat UI to Azure Container Apps. Runs only after QA Approval succeeds.
#
# Jobs deliberately declare no `environment`, so the OIDC subject stays
# `repo:<org>/<repo>:ref:refs/heads/<default-branch>` and matches the existing
# federated credential.

on:
  workflow_run:
    workflows: ["QA Approval"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit SHA or branch to deploy. Defaults to this workflow's ref.
        type: string
        required: false
        default: ""
      recreate_project:
        description: Delete the QA project first, then recreate it.
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: foundry-qa
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.QA_RESOURCE_GROUP || 'rg-sombaner-foundry' }}
  QA_SUBSCRIPTION_ID: ${{ vars.QA_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
  QA_LOCATION: ${{ vars.QA_LOCATION || 'eastus' }}
  QA_ACCOUNT_NAME: ${{ vars.QA_FOUNDRY_ACCOUNT || 'sombaner-azure-foundry' }}
  QA_CREATE_ACCOUNT: ${{ vars.QA_CREATE_ACCOUNT || 'false' }}
  QA_PROJECT_NAME: ${{ vars.QA_PROJECT_NAME || 'sombaner-foundry-qa' }}
  QA_MODEL_DEPLOYMENT: ${{ vars.QA_MODEL_DEPLOYMENT || 'claude-haiku-4-5' }}
  QA_MODEL_NAME: ${{ vars.QA_MODEL_NAME || 'claude-haiku-4-5' }}
  QA_MODEL_FORMAT: ${{ vars.QA_MODEL_FORMAT || 'Anthropic' }}
  QA_MODEL_SKU: ${{ vars.QA_MODEL_SKU || 'GlobalStandard' }}
  QA_MODEL_CAPACITY: ${{ vars.QA_MODEL_CAPACITY || '1' }}
  QA_ACR_NAME: ${{ vars.QA_ACR_NAME || format('acritsupportqa{0}', github.repository_id) }}
  COGNITIVE_SERVICES_API_VERSION: "2025-06-01"
  # Single place to change the chat UI's resource group/location; shared with deploy-to-foundry.yml.
  UI_RESOURCE_GROUP: rg-support-agent
  UI_LOCATION: eastus
  UI_APP_NAME: it-support-ui
  # fix done by copilot: Container Apps capacity is allocated per region and East US returns
  # ManagedEnvironmentCapacityHeavyUsageError. The managed environment and container app get
  # their own region so a capacity-blocked region can be swapped without relocating the
  # registry, workspace or identity (those cannot change location in place). Override with
  # the UI_APP_LOCATION repository variable; see https://aka.ms/acaregions.
  UI_APP_LOCATION: ${{ vars.UI_APP_LOCATION || 'eastus2' }}
  # ARM cannot register resource providers from Bicep, so the UI stack's namespaces
  # are registered explicitly before deployment. Keep in sync with infra/ui-stack.bicep
  # and infra/ui.bicep, and with the register/action list in infra/ci-rbac.bicep.
  UI_RESOURCE_PROVIDERS: Microsoft.ContainerRegistry Microsoft.App Microsoft.OperationalInsights Microsoft.ManagedIdentity

jobs:
  provision:
    name: Provision QA Foundry project
    # Guard the chained trigger: only a successful approval may deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      project_endpoint: ${{ steps.deploy.outputs.project_endpoint }}
      project_id: ${{ steps.deploy.outputs.project_id }}
      account_name: ${{ steps.deploy.outputs.account_name }}
      model_deployment: ${{ steps.deploy.outputs.model_deployment }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}

    steps:
      - name: Resolve commit
        id: resolve
        env:
          INPUT_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-}"
          if [ -z "$REF" ]; then
            REF="${{ github.sha }}"
          fi
          echo "source_ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.source_ref }}

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.QA_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          set -euo pipefail
          if ! az group show --name "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az group create --name "$AZURE_RESOURCE_GROUP" --location "$QA_LOCATION" --output none
          fi

      - name: Deploy QA Foundry project and model
        id: deploy
        env:
          # qa-deployment.bicep deletes the existing project, then recreates it.
          RECREATE_PROJECT: ${{ inputs.recreate_project != false }}
        run: |
          set -euo pipefail
          # Optional: only set when the CI identity can read its own directory object.
          PRINCIPAL_ID="$(az ad sp show --id '${{ vars.AZURE_CLIENT_ID }}' --query id -o tsv 2>/dev/null || echo '')"

          OUTPUTS=$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "qa-foundry-${{ github.run_id }}" \
            --template-file infra/qa-deployment.bicep \
            --parameters \
              location="$QA_LOCATION" \
              accountName="$QA_ACCOUNT_NAME" \
              createAccount="$QA_CREATE_ACCOUNT" \
              projectName="$QA_PROJECT_NAME" \
              recreateProject="$RECREATE_PROJECT" \
              modelDeploymentName="$QA_MODEL_DEPLOYMENT" \
              modelName="$QA_MODEL_NAME" \
              modelFormat="$QA_MODEL_FORMAT" \
              modelSkuName="$QA_MODEL_SKU" \
              modelCapacity="$QA_MODEL_CAPACITY" \
              cognitiveServicesApiVersion="$COGNITIVE_SERVICES_API_VERSION" \
              deployerPrincipalId="$PRINCIPAL_ID" \
            --query properties.outputs -o json)

          echo "project_endpoint=$(echo "$OUTPUTS" | jq -r '.projectEndpoint.value')" >> "$GITHUB_OUTPUT"
          echo "project_id=$(echo "$OUTPUTS" | jq -r '.projectId.value')" >> "$GITHUB_OUTPUT"
          echo "account_name=$(echo "$OUTPUTS" | jq -r '.accountName.value')" >> "$GITHUB_OUTPUT"
          echo "model_deployment=$(echo "$OUTPUTS" | jq -r '.modelDeploymentName.value')" >> "$GITHUB_OUTPUT"
          echo "project_deleted=$(echo "$OUTPUTS" | jq -r '.projectDeleted.value')" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### QA Foundry provisioned"
            echo ""
            echo "- Project: \`${{ steps.deploy.outputs.account_name }}/${QA_PROJECT_NAME}\`"
            echo "- Endpoint: \`${{ steps.deploy.outputs.project_endpoint }}\`"
            echo "- Model: \`${{ steps.deploy.outputs.model_deployment }}\`"
            echo "- Pre-existing project deleted: \`${{ steps.deploy.outputs.project_deleted }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-agent:
    name: Deploy hosted agent to QA
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZD_ENV_NAME: qa
      AZURE_DEV_USER_AGENT: microsoft_foundry_skill
      AGENT_TEST_PROMPT: Hello from QA CI. Reply with a short confirmation that you are running.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.provision.outputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install and verify Foundry extension
        run: |
          set -euo pipefail
          azd config set alpha.extensions on
          azd ext install microsoft.foundry
          azd ext list | grep -q "microsoft.foundry"
          azd ai agent --help > /dev/null

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.QA_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "$QA_SUBSCRIPTION_ID"

      - name: Configure QA environment
        env:
          PROJECT_ENDPOINT: ${{ needs.provision.outputs.project_endpoint }}
          PROJECT_ID: ${{ needs.provision.outputs.project_id }}
          MODEL_DEPLOYMENT: ${{ needs.provision.outputs.model_deployment }}
        run: |
          set -euo pipefail
          azd env select "$AZD_ENV_NAME" || azd env new "$AZD_ENV_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$QA_SUBSCRIPTION_ID"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "$QA_LOCATION"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$PROJECT_ENDPOINT"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$PROJECT_ENDPOINT"
          azd env set AZURE_AI_PROJECT_ID "$PROJECT_ID"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$MODEL_DEPLOYMENT"

      - name: Deploy agent
        run: azd deploy --no-prompt

      - name: Show deployed agent
        run: azd ai agent show || true

  deploy-ui:
    name: Deploy chat UI to Container Apps
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      url: ${{ steps.ui.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.provision.outputs.source_ref }}

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.QA_SUBSCRIPTION_ID }}

      # fix done by copilot: a subscription that has never used these resource types fails
      # deployment with MissingSubscriptionRegistration. ARM/Bicep cannot register a resource
      # provider (there is no ARM resource type for it), so registration has to happen here.
      # The call is idempotent and a no-op once the subscription is registered.
      - name: Register required resource providers
        run: |
          set -euo pipefail
          MISSING=""
          for NS in $UI_RESOURCE_PROVIDERS; do
            STATE=$(az provider show --namespace "$NS" --query registrationState -o tsv 2>/dev/null || echo "Unknown")
            if [ "$STATE" = "Registered" ]; then
              echo "$NS: already registered"
              continue
            fi
            echo "Registering $NS (current state: $STATE)"
            if ! az provider register --namespace "$NS" --wait; then
              MISSING="$MISSING $NS"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Could not register resource provider(s):$MISSING. The CI identity needs the"
            echo "::error::subscription-scope '<namespace>/register/action' permission. Deploy infra/ci-rbac.bicep"
            echo "::error::with a privileged identity, or have an owner run: az provider register --namespace <ns> --wait"
            exit 1
          fi

      - name: Deploy resource group and container registry
        run: |
          set -euo pipefail
          az deployment sub create \
            --location "$UI_LOCATION" \
            --name "ui-stack-${{ github.run_id }}" \
            --template-file infra/ui-stack.bicep \
            --parameters \
              resourceGroupName="$UI_RESOURCE_GROUP" \
              location="$UI_LOCATION" \
              registryName="$QA_ACR_NAME" \
            --output none

      - name: Build and push UI image
        id: image
        env:
          SOURCE_REF: ${{ needs.provision.outputs.source_ref }}
        run: |
          set -euo pipefail
          TAG="${SOURCE_REF:0:7}-${{ github.run_number }}"
          LOGIN_SERVER=$(az acr show --name "$QA_ACR_NAME" --query loginServer -o tsv)
          # Server-side build: no Docker daemon or registry credentials needed on the runner.
          az acr build \
            --registry "$QA_ACR_NAME" \
            --image "it-support-ui:${TAG}" \
            --file Dockerfile \
            . \
            --output none
          echo "image=${LOGIN_SERVER}/it-support-ui:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy container app
        id: ui
        env:
          PROJECT_ENDPOINT: ${{ needs.provision.outputs.project_endpoint }}
          ACCOUNT_NAME: ${{ needs.provision.outputs.account_name }}
          MODEL_DEPLOYMENT: ${{ needs.provision.outputs.model_deployment }}
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          # fix done by copilot: ARM collapses a Container Apps failure to a generic "terminal
          # provisioning state 'Failed'" and drops the resource provider's real message, so a
          # failed run cannot be diagnosed from its own log. On failure, read
          # properties.deploymentErrors off the managed environment and surface it here.
          if ! URL=$(az deployment group create \
            --resource-group "$UI_RESOURCE_GROUP" \
            --name "qa-ui-${{ github.run_id }}" \
            --template-file infra/ui.bicep \
            --parameters \
              location="$UI_LOCATION" \
              appLocation="$UI_APP_LOCATION" \
              appName="$UI_APP_NAME" \
              environmentName=qa \
              registryName="$QA_ACR_NAME" \
              containerImage="$CONTAINER_IMAGE" \
              foundryAccountName="$ACCOUNT_NAME" \
              foundryResourceGroupName="$AZURE_RESOURCE_GROUP" \
              foundryProjectEndpoint="$PROJECT_ENDPOINT" \
              modelDeploymentName="$MODEL_DEPLOYMENT" \
            --query properties.outputs.url.value -o tsv); then
            ENV_NAME="cae-${UI_APP_NAME}-qa-${UI_APP_LOCATION}"
            ERRORS=$(az containerapp env show --name "$ENV_NAME" --resource-group "$UI_RESOURCE_GROUP" \
              --query properties.deploymentErrors -o tsv 2>/dev/null || true)
            if [ -n "$ERRORS" ]; then
              echo "::error::Managed environment '$ENV_NAME' failed: $ERRORS"
            fi
            case "$ERRORS" in
              *CapacityHeavyUsage*)
                echo "::error::'$UI_APP_LOCATION' has no Container Apps capacity right now. Set the"
                echo "::error::UI_APP_LOCATION repository variable to another region (https://aka.ms/acaregions)"
                echo "::error::and re-run. A failed environment never self-heals, so if you retry the same"
                echo "::error::region first delete it: az containerapp env delete -n $ENV_NAME -g $UI_RESOURCE_GROUP --yes"
                ;;
            esac
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify UI health
        env:
          URL: ${{ steps.ui.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/healthz" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "UI healthy at ${URL}"
              exit 0
            fi
            echo "Attempt ${attempt}: got HTTP ${CODE}; retrying in 15s"
            sleep 15
          done
          echo "UI did not become healthy at ${URL}"
          exit 1

      - name: Summary
        env:
          URL: ${{ steps.ui.outputs.url }}
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "### QA chat UI deployed"
            echo ""
            echo "- URL: ${URL}"
            echo "- Image: \`${CONTAINER_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
